<!DOCTYPE html>
<html lang="zh - CN">
  <head>
    <meta charset="UTF - 8" />
    <meta name="viewport" content="width=device-width, initial - scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      function subsets(nums) {
        const result = [];

        function backtrack(start, path) {
          // 每次进入都记录当前路径（即一个子集）
          result.push([...path]);

          for (let i = start; i < nums.length; i++) {
            // 做选择：将当前数字加入子集
            path.push(nums[i]);
            // 递归下一层，从 i + 1 开始，避免重复
            backtrack(i + 1, path);
            // 撤销选择：回溯
            path.pop();
          }
        }

        backtrack(0, []);
        return result;
      }
      console.log(subsets([1, 2, 3]));
    </script>
  </body>
</html>
